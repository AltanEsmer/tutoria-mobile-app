appId: ac.tutoria.mobile
name: "Sign In Error Flow"
---
- launchApp:
    clearState: true
- assertVisible:
    text: "Welcome back"
- tapOn:
    id: "sign-in-email-input"
- eraseText
- inputText: "invalid@example.com"
- tapOn:
    id: "sign-in-password-input"
- eraseText
- inputText: "wrongpassword"
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
# Should show error
- assertVisible:
    id: "sign-in-error-text"
    waitUntilVisible: 3000
