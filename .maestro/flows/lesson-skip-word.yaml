appId: ac.tutoria.mobile
name: "Lesson Skip Word"
---
- launchApp
- assertVisible:
    text: "Good"
    timeout: 5000
- assertVisible:
    id: "nfc-prompt-manual-card"
    timeout: 3000
- tapOn:
    id: "nfc-prompt-manual-input"
- clearText
- inputText: "module-001"
- hideKeyboard
- tapOn:
    id: "nfc-prompt-start-lesson-button"
- assertVisible:
    id: "lesson-screen"
    timeout: 8000
- assertVisible:
    id: "lesson-skip-button"
# Skip the word
- tapOn:
    id: "lesson-skip-button"
# Word should advance (progress updates or next word appears)
- assertVisible:
    id: "word-display-card"
    timeout: 3000
