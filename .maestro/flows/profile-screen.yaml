appId: ac.tutoria.mobile
name: "Profile Screen"
---
- launchApp
- assertVisible:
    text: "Good"
    waitUntilVisible: 5000
# Navigate to Profile tab
- tapOn:
    text: "Profile"
- assertVisible:
    id: "profile-screen"
    waitUntilVisible: 3000
# Verify key elements
- assertVisible:
    id: "profile-header-title"
- assertVisible:
    id: "profile-sign-out-button"
- assertVisible:
    text: "Profiles"
