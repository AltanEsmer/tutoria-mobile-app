appId: ac.tutoria.mobile
name: "Progress Screen"
---
- launchApp
- assertVisible:
    text: "Good"
    waitUntilVisible: 5000
# Navigate to Progress tab
- tapOn:
    text: "Progress"
- assertVisible:
    id: "progress-screen"
    waitUntilVisible: 5000
# Verify title is visible
- assertVisible:
    id: "progress-title"
- assertVisible:
    id: "progress-weekly-title"
- assertVisible:
    id: "progress-words-title"
