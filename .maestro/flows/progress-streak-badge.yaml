appId: ac.tutoria.mobile
name: "Progress Streak Badge"
---
- launchApp
- assertVisible:
    text: "Good"
    waitUntilVisible: 5000
- tapOn:
    text: "Progress"
- assertVisible:
    id: "progress-screen"
    waitUntilVisible: 5000
# Streak badge should be visible
- assertVisible:
    id: "streak-badge"
    waitUntilVisible: 3000
- assertVisible:
    id: "streak-badge-count"
- assertVisible:
    id: "streak-badge-label"
