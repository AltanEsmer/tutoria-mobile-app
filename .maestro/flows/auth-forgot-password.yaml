appId: ac.tutoria.mobile
name: "Forgot Password Navigation"
env:
  TEST_EMAIL: ${TEST_EMAIL}
---
- launchApp:
    clearState: true
- assertVisible:
    text: "Welcome back"
# Navigate to forgot password
- tapOn:
    id: "sign-in-forgot-password-link"
- assertVisible:
    text: "Forgot password?"
# Enter email
- tapOn:
    id: "forgot-password-email-input"
- eraseText
- inputText: ${TEST_EMAIL}
- hideKeyboard
# We don't actually submit (would hit real Clerk API)
# Just verify the form is rendered correctly
- assertVisible:
    id: "forgot-password-send-button"
# Go back
- tapOn:
    id: "forgot-password-back-link"
- assertVisible:
    text: "Welcome back"
