appId: ac.tutoria.mobile
name: "Lesson Screen Navigation"
---
- launchApp
- assertVisible:
    text: "Good"
    timeout: 5000
# Use manual NFC entry to start a lesson
# On simulators/emulators, NFC is not available so manual entry is shown
- assertVisible:
    id: "nfc-prompt-manual-card"
    timeout: 3000
- tapOn:
    id: "nfc-prompt-manual-input"
- clearText
- inputText: "module-001"
- hideKeyboard
- tapOn:
    id: "nfc-prompt-start-lesson-button"
# Lesson screen should load
- assertVisible:
    id: "lesson-screen"
    timeout: 8000
# Verify key elements exist
- assertVisible:
    id: "lesson-back-button"
- assertVisible:
    id: "lesson-play-button"
- assertVisible:
    id: "lesson-record-button"
- assertVisible:
    id: "word-display-card"
# Go back
- tapOn:
    id: "lesson-back-button"
- assertVisible:
    text: "Good"
    timeout: 3000
