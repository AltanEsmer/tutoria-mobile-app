appId: ac.tutoria.mobile
name: "Start Lesson via Manual Code Entry"
---
- launchApp
- assertVisible:
    text: "Good"
    waitUntilVisible: 5000
# In simulator/emulator NFC is not available, so manual entry is shown
- assertVisible:
    id: "nfc-prompt-manual-card"
    waitUntilVisible: 3000
- tapOn:
    id: "nfc-prompt-manual-input"
- eraseText
- inputText: "module-001"
- hideKeyboard
- tapOn:
    id: "nfc-prompt-start-lesson-button"
# Should navigate to lesson screen
- assertVisible:
    text: "Word 1 of"
    waitUntilVisible: 5000
