appId: ac.tutoria.mobile
name: "Lesson Word Display"
---
- launchApp
- assertVisible:
    text: "Good"
    timeout: 5000
- assertVisible:
    id: "nfc-prompt-manual-card"
    timeout: 3000
- tapOn:
    id: "nfc-prompt-manual-input"
- clearText
- inputText: "module-001"
- hideKeyboard
- tapOn:
    id: "nfc-prompt-start-lesson-button"
- assertVisible:
    id: "lesson-screen"
    timeout: 8000
# Verify word is displayed
- assertVisible:
    id: "word-display-card"
- assertVisible:
    id: "lesson-progress-label"
# Tap play button
- tapOn:
    id: "lesson-play-button"
# Audio plays - just verify the button is still there
- assertVisible:
    id: "lesson-play-button"
